
name: flutter_app
description: "Ứng dụng thử mẫu Nail ảo trên hình ảnh bàn tay"

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  # Biểu tượng giao diện
  cupertino_icons: ^1.0.8

  # Chọn ảnh bàn tay
  image_picker: ^1.2.4
  camera: ^0.12.1
  shared_preferences: ^2.5.6
  share_plus: ^13.3.1

  # Lưu ảnh thiết kế
  file_saver: ^0.4.0

  # Xử lý ảnh và màu sắc
  image: ^4.12.0

  # Kết nối Flutter với Node.js và Python AI
  http: ^1.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/nails/
    - assets/nails/sets/set_01/
    - assets/nails/collections/
    - assets/nails/prepared/
